[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fair2-validator"
version = "0.1.0"
description = "Validate (and agent-fix) FAIR² JSON-LD against the canonical fair2-spec"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-4.0" }
dependencies = [
    "pyshacl>=0.20.3",
    "rdflib>=6.3.2",
    "mlcroissant>=1.1.0",
]

[project.optional-dependencies]
agent = ["anthropic>=0.40"]
dev = ["pytest>=7"]

[project.scripts]
fair2-validate = "fair2_validator.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
