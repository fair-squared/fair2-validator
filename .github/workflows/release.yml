name: release

# Cut a release when a version tag is pushed (`git tag vX.Y.Z && git push origin vX.Y.Z`).
#
# Every tag creates a GitHub Release with the wheel and sdist attached. Consumers
# install from the tag (`fair2-validator @ git+https://github.com/fair-squared/
# fair2-validator@vX.Y.Z`) or from the attached wheel.
#
# Publishing to PyPI is OFF until a trusted publisher is registered there: the
# v0.2.0 run failed with `invalid-publisher` for that reason. To turn it on,
# register the publisher on pypi.org (owner=fair-squared, repo=fair2-validator,
# workflow=release.yml, environment=pypi), then set the repository variable
# PYPI_PUBLISH=true. Trusted Publishing uses OIDC; no token is stored here.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # need fair2-spec to vendor into the package

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vendor the pinned spec into the package
        run: python scripts/sync_spec.py

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify the spec data made it into the wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = [n for n in zipfile.ZipFile(whl).namelist() if "_spec_data" in n]
          print("\n".join(names))
          assert any(n.endswith("dataset.ttl") for n in names), "spec shapes missing from wheel"
          assert any(n.endswith("VERSION") for n in names), "spec VERSION missing from wheel"
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create the release and upload its assets
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Create the GitHub Release with the built artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

  publish:
    needs: build
    if: vars.PYPI_PUBLISH == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
