name: release

# Publish to PyPI when a version tag is pushed (e.g. `git tag v0.2.0 && git push --tags`).
# Uses PyPI Trusted Publishing (OIDC) — no API token stored in the repo.
# One-time setup on PyPI: project settings -> Publishing -> add a GitHub trusted
# publisher with owner=fair-squared, repo=fair2-validator, workflow=release.yml,
# environment=pypi.

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive   # need fair2-spec to vendor into the package

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Vendor the pinned spec into the package
        run: python scripts/sync_spec.py

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Verify the spec data made it into the wheel
        run: |
          python - <<'PY'
          import glob, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = [n for n in zipfile.ZipFile(whl).namelist() if "_spec_data" in n]
          print("\n".join(names))
          assert any(n.endswith("dataset.ttl") for n in names), "spec shapes missing from wheel"
          assert any(n.endswith("VERSION") for n in names), "spec VERSION missing from wheel"
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
